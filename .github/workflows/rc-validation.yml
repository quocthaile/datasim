name: RC verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-ucrt:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-pdf
            mingw-w64-ucrt-x86_64-qt6-svg
      - name: Verify pinned Poppler extraction backend
        run: |
          curl --fail --location https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-poppler-26.10.0-1-any.pkg.tar.zst -o poppler.pkg.tar.zst
          echo '29971b323692b327aeacbf643180c129af23219b8aaa0b5cbcffc05e95a6334a  poppler.pkg.tar.zst' | sha256sum --check
          pacman --noconfirm -U poppler.pkg.tar.zst
          pdftotext -v 2>&1 | tee pdf-backend-version.txt
          grep -q 'pdftotext version 26.10.0' pdf-backend-version.txt
          pdfinfo -v 2>&1 | tee pdfinfo-version.txt
          grep -q 'pdfinfo version 26.10.0' pdfinfo-version.txt
          python tests/fixtures/make_synthetic_datasheet_pdf.py
          python tests/fixtures/make_hierarchy_pdf.py
          python tests/fixtures/make_baseline_pdf.py
      - name: Install pinned ngspice release
        run: |
          curl --fail --location https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-ngspice-47-1-any.pkg.tar.zst -o ngspice.pkg.tar.zst
          echo 'a9f615da61165c79a904232641e5c3e31fcc5b21c01b1018965b95d543faadf4  ngspice.pkg.tar.zst' | sha256sum --check
          pacman --noconfirm -U ngspice.pkg.tar.zst
          ngspice_con --version | tee backend-version.txt
          grep -q 'ngspice-47 ' backend-version.txt
          mkdir -p build/runtime-config
          tar -xOf ngspice.pkg.tar.zst .INSTALL > build/runtime-config/package-install.txt
          tar -xOf ngspice.pkg.tar.zst ucrt64/share/ngspice/scripts/spinit > build/runtime-config/spinit.packaged
          echo "NGSPICE_PREFIX=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"
      - name: Verify installed code-model paths and runtime initialization
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ci -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $spinit = "$env:NGSPICE_PREFIX/share/ngspice/scripts/spinit"
          $executable = "$env:NGSPICE_PREFIX/bin/ngspice_con.exe"
          python scripts/ci/configure_ngspice.py --spinit $spinit --prefix $env:NGSPICE_PREFIX --ngspice $executable --diagnostics build/runtime-config/first
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/configure_ngspice.py --spinit $spinit --prefix $env:NGSPICE_PREFIX --ngspice $executable --diagnostics build/runtime-config/second
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash build/runtime-config/first/spinit.after).Hash -ne (Get-FileHash build/runtime-config/second/spinit.after).Hash) { throw 'spinit changed on second invocation' }
      - name: Configure and build clean checkout
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DDATASIM_NGSPICE="$(cygpath -m /ucrt64/bin/ngspice_con.exe)"
          cmake --build build/ci
      - name: Unit and process tests without backend requirement
        run: ctest --test-dir build/ci -L unit --output-on-failure --output-junit unit.xml
      - name: Required real backend integration
        run: |
          ctest --test-dir build/ci -L integration --no-tests=error --output-on-failure --output-junit integration.xml
          if grep -Eq 'Status="notrun"|status="notrun"' integration.xml; then
            echo "Required integration test was skipped; hosted verification is invalid"
            exit 1
          fi
      - name: Convergence and repeatability
        run: ./build/ci/rc_study.exe "$(cygpath -m /ucrt64/bin/ngspice_con.exe)" build/ci-study
      - name: Build and test optional desktop workbench
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DDATASIM_BUILD_DESKTOP=ON -DDATASIM_NGSPICE="$(cygpath -m /ucrt64/bin/ngspice_con.exe)"
          cmake --build build/desktop
          ctest --test-dir build/desktop --output-on-failure --no-tests=error
      - name: Build and test optional Qt PDF evidence workbench
        run: |
          cmake -S . -B build/pdf-workbench -G Ninja -DCMAKE_BUILD_TYPE=Release -DDATASIM_BUILD_DESKTOP=ON -DDATASIM_BUILD_PDF_WORKBENCH=ON -DDATASIM_NGSPICE="$(cygpath -m /ucrt64/bin/ngspice_con.exe)"
          cmake --build build/pdf-workbench
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/pdf-workbench --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-verification-windows
          path: |
            backend-version.txt
            pdf-backend-version.txt
            pdfinfo-version.txt
            build/runtime-config/
            build/ci/Testing/
            build/desktop/Testing/
            build/pdf-workbench/Testing/
            build/ci/*.xml
            build/ci/integration run */
            build/ci/fault tests/
            build/ci-study/
          if-no-files-found: warn
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ cmake ninja-build python3 poppler-utils ngspice
          g++ --version | head -1
          cmake --version | head -1
          pdfinfo -v 2>&1 | head -1
          pdftotext -v 2>&1 | head -1
          ngspice --version | head -3
      - name: Generate committed synthetic PDFs
        run: |
          python3 -B tests/fixtures/make_synthetic_datasheet_pdf.py
          python3 -B tests/fixtures/make_hierarchy_pdf.py
          python3 -B tests/fixtures/make_baseline_pdf.py
      - name: Configure and build Linux core
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DDATASIM_NGSPICE="$(command -v ngspice)"
          cmake --build build/linux --parallel 4
      - name: Run Linux core and real integrations
        run: |
          ctest --test-dir build/linux --output-on-failure --output-junit build/linux/ctest.xml
          if grep -Eiq 'status="notrun"|Status="notrun"' build/linux/ctest.xml; then
            echo "A required Linux test was skipped"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-verification-linux
          path: build/linux/ctest.xml
          if-no-files-found: warn
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux sanitizer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ cmake ninja-build python3 poppler-utils ngspice
          g++ --version | head -1
      - name: Generate committed synthetic PDFs
        run: |
          python3 -B tests/fixtures/make_synthetic_datasheet_pdf.py
          python3 -B tests/fixtures/make_hierarchy_pdf.py
          python3 -B tests/fixtures/make_baseline_pdf.py
      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer build
        run: |
          cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DDATASIM_NGSPICE="$(command -v ngspice)"
          cmake --build build/sanitizers --parallel 4
      - name: Run sanitizer tests and required integrations
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build/sanitizers --output-on-failure --output-junit build/sanitizers/ctest.xml
          if grep -Eiq 'status="notrun"|Status="notrun"' build/sanitizers/ctest.xml; then
            echo "A sanitizer test or required integration was skipped"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-verification-linux-sanitizers
          path: build/sanitizers/ctest.xml
          if-no-files-found: warn
